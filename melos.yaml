name: dart_mapper

packages:
  - example
  - packages/dart_mapper
  - packages/dart_mapper_generator

scripts:
  generate-example-code:
    description: Generate code
    steps:
      - fvm install
      - fvm flutter pub get
      - fvm dart run build_runner build --workspace

  analyze-example-code:
    description: Analyze code
    steps:
      - fvm install
      - fvm flutter pub get
      - fvm dart analyze
